workflows:
  android_debug:
    name: Android Debug
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        ANDROID_SDK_ROOT: /usr/local/share/android-sdk
    cache:
      cache_paths:
        - ~/.pub-cache
        - $ANDROID_SDK_ROOT
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Install Android SDK 36 + Build-Tools 36
        script: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Flutter pub get
        script: flutter pub get

      - name: Build debug APK + fallback Gradle
        script: |
          flutter build apk --debug --dart-define=STRIPE_PK=$STRIPE_PK || true
          (cd android && ./gradlew :app:assembleDebug -x lint)
          mkdir -p build/app/outputs/flutter-apk
          cp -f android/app/build/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-debug.apk || true

    artifacts:
      - build/**/outputs/**/*.apk
      - android/app/build/outputs/**/*.apk

  ios_release:
    name: iOS Release
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      # ⚠️ C’est ÇA qui dit à Codemagic d’utiliser
      # ton certificat + ton provisioning profile déjà ajoutés
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ridemyway.app

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
        - ~/Library/Developer/Xcode/DerivedData

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          pod install
          cd ..

      - name: Appliquer les provisioning profiles au projet Xcode
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release --no-tree-shake-icons \
            --dart-define=STRIPE_PK=$STRIPE_PK

    artifacts:
      - build/ios/ipa/*.ipa
