workflows:
  android_debug:
    name: Android Debug
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        ANDROID_SDK_ROOT: /usr/local/share/android-sdk
    cache:
      cache_paths:
        - ~/.pub-cache
        - $ANDROID_SDK_ROOT
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Install Android SDK 36 + Build-Tools 36
        script: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Flutter pub get
        script: flutter pub get

      - name: Build debug APK + fallback Gradle
        script: |
          flutter build apk --debug --dart-define=STRIPE_PK=$STRIPE_PK || true
          (cd android && ./gradlew :app:assembleDebug -x lint)
          mkdir -p build/app/outputs/flutter-apk
          cp -f android/app/build/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-debug.apk || true

    artifacts:
      - build/**/outputs/**/*.apk
      - android/app/build/outputs/**/*.apk

  ios_release:
    name: iOS Release
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials # APP_STORE_CONNECT_PRIVATE_K / APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.ridemyway.app"

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
        - ~/Library/Developer/Xcode/DerivedData

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          pod install
          cd ..

      - name: Fetch signing files (App Store + Development)
        script: |
          set -e
          keychain initialize

          echo "=== Fetch App Store signing files ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_K"

          echo "=== Fetch Development signing files ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_DEVELOPMENT \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_K"

          echo "=== Add certificates to keychain ==="
          keychain add-certificates

          echo "=== Apply provisioning profiles to Xcode project ==="
          xcode-project use-profiles

          echo "=== Check code signing identities ==="
          security find-identity -v -p codesigning || true

      - name: Build IPA
        script: |
          flutter build ipa --release --no-tree-shake-icons \
            --dart-define=STRIPE_PK=$STRIPE_PK

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
