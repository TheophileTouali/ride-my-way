workflows:
  android_debug:
    name: Android Debug
    instance_type: mac_mini_m2 # ou linux_x2 si tu préfères Linux
    environment:
      flutter: stable
      java: 17
      vars:
        ANDROID_SDK_ROOT: /usr/local/share/android-sdk
        # STRIPE_PK: sera récupéré depuis les variables d'environnement Codemagic si tu l'as défini là-bas
    cache:
      cache_paths:
        - ~/.pub-cache
        - $ANDROID_SDK_ROOT
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Install Android SDK 36 + Build-Tools 36
        script: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Flutter pub get
        script: |
          flutter --version
          flutter pub get

      - name: Build debug APK (Flutter) + fallback Gradle + copie APK
        script: |
          # Build Flutter (peut échouer à copier l'APK selon l'arborescence)
          flutter build apk --debug --dart-define=STRIPE_PK=$STRIPE_PK || true

          # Fallback: build via Gradle si besoin
          (cd android && ./gradlew :app:assembleDebug -x lint)

          # Copie à l'emplacement attendu par Flutter
          mkdir -p build/app/outputs/flutter-apk
          cp -f android/app/build/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-debug.apk || true

          # Affiche les APK trouvés
          find android/app/build/outputs -type f -name "*.apk" -print
          find build -type f -name "*.apk" -print

    artifacts:
      - build/**/outputs/**/*.apk
      - android/app/build/outputs/**/*.apk

  ios_release:
    name: iOS Release
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.ridemyway.app" # <-- ton nouveau bundle ID (à mettre aussi dans project.pbxproj)
        # STRIPE_PK: sera récupéré depuis les variables d'environnement Codemagic si tu l'as défini
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
        - ~/Library/Developer/Xcode/DerivedData
    scripts:
      - name: Flutter pub get
        script: |
          flutter --version
          flutter pub get

      - name: Pod install
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS IPA (Release)
        script: |
          flutter build ipa --release --no-tree-shake-icons \
            --dart-define=STRIPE_PK=$STRIPE_PK

    artifacts:
      - build/ios/ipa/*.ipa
