name: ride_my_way
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  go_router: ^15.1.2
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.5.4

  # Formulaires / permissions
  permission_handler: ^12.0.0+1
  image_picker: ^1.0.7
  file_picker: ^6.1.1

  # Géolocalisation
  geolocator: ^10.1.0
  geocoding: ^2.1.0

  # Autocomplétion
  google_places_flutter: ^2.1.0
  google_places_autocomplete_text_field: ^1.1.0

  # HTTP / API
  http: ^0.13.5

  # Outils
  equatable: ^2.0.5
  lucide_icons: ^0.257.0

  # Graphiques & animations
  fl_chart: ^0.66.2
  lottie: ^2.7.0
  animated_background: ^2.0.0
  flutter_animate: ^4.2.0
  animate_do: ^3.0.0
  diacritic: ^0.1.3

  # Splash
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont_wght.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-VariableFont_wght.ttf
          style: italic

flutter_native_splash:
  color: "#121212"
  image: assets/images/splash_icon.png
  branding: assets/images/logo.png
  branding_mode: bottom
  android: true
  ios: true
